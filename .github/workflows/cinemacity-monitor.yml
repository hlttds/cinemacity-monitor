name: Cinemacity Odyssea 70mm Monitor

on:
  schedule:
    - cron: "5 6-21 * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "If set, skip the check and just send this test message via Telegram"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check showtimes and notify via Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ github.event.inputs.test_message }}
        run: python3 scripts/check_odyssea.py
