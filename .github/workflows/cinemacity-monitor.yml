name: Cinemacity Odyssea 70mm Monitor

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      test_show_date:
        description: "Override SHOW_DATE for a test run against an already-published date"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check showtimes and notify via Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_SHOW_DATE: ${{ github.event.inputs.test_show_date }}
        run: python3 scripts/check_odyssea.py
